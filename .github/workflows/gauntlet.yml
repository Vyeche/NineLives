# NineLives Gauntlet: every pull request and every push to main runs the same checks as
# `bash scripts/check.sh` on a clean Ubuntu runner, so a change from anyone is tested the same way.
#
#   lint      actionlint over these workflows (expression, permission and typo mistakes)
#   quick     syntax, unit tests, install into a temp folder, sound loudness, doc links   (~1 min)
#   kitty     all of the above plus a real kitty 0.51 on a hidden X display (Xvfb): status icons,
#             sounds (stubbed), badges, Ctrl+Alt+U, sidebar buttons, short window, screenshot, and
#             a restart that brings split tabs back                                     (~3 min)
#   macos     scripts/check-macos.sh on a macOS runner with the official kitty 0.51 .dmg, using
#             what a Mac has out of the box (/bin/bash 3.2, /usr/bin/python3, zsh, BSD tools): unit
#             tests, install/uninstall, afplay's formats, osascript, the agent lookup against real
#             processes. Its last part (the real kitty: socket, sidebar mark, restart) is skipped
#             with a warning: the runners have no OpenGL 3.3, so kitty can't open a window (~5 min)
#   required  one summary check that fails if any lane it lists failed: make this the only required
#             status check on main (Settings → Rules), so new lanes don't need a settings change.
#             macos isn't in it yet (new; add it to `needs` below once it has passed a few runs)
#   guard     HOL Guard's repository scan, attestation and public verification. Only on pushes to
#             main, weekly (a verification lasts 7 days) and by hand: it needs write permissions
#             a fork's pull request never gets, so PRs rely on the checks above.
#
# Safety (pattern from HOL Guard): pull_request (never pull_request_target), so a PR's code runs
# with a read-only token and no secrets; every action and download is pinned (commit SHA or
# SHA-256); checkout keeps no credentials; every job has a timeout; a newer push to the same PR
# cancels the old run; write permissions exist only in the guard job, which never runs PR code.
name: Gauntlet

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"      # Mondays: keeps HOL Guard's 7-day verification fresh
  workflow_dispatch:

permissions: {}

concurrency:
  group: gauntlet-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  KITTY_VERSION: "0.51.0"
  # SHA-256 of kitty-0.51.0-x86_64.txz from kitty's GitHub release; change both together
  KITTY_SHA256: "c285daaf1b699997614939c8d1cd92dd8b99302ff12f18efcc3f69382aa72b1d"
  # SHA-256 of kitty-0.51.0.dmg (macOS) from the same release, as GitHub records it for the asset
  KITTY_DMG_SHA256: "e7d51ec9f1978ff2fee61647b6f7eb59530e06d9bb1af876b00357ca7779638d"
  ACTIONLINT_VERSION: "1.7.12"
  # SHA-256 of actionlint_1.7.12_linux_amd64.tar.gz (matches the release's checksums.txt)
  ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: actionlint ${{ env.ACTIONLINT_VERSION }} (checksum-pinned)
        run: |
          url="https://github.com/rhysd/actionlint/releases/download/v$ACTIONLINT_VERSION/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/actionlint.tgz" "$url"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/actionlint.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tgz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color

  quick:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - name: Tools (ffmpeg for the sound loudness check; a static build from PyPI, hash-pinned)
        run: bash scripts/ci-ffmpeg.sh
      - name: check.sh --quick
        run: bash scripts/check.sh --quick

  kitty:
    needs: quick
    runs-on: ubuntu-24.04
    timeout-minutes: 30   # ci-apt.sh may need three tries (up to ~14 min) on a slow mirror
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - name: ffmpeg (screenshots and the loudness check; a static build from PyPI, hash-pinned)
        run: bash scripts/ci-ffmpeg.sh
      - name: Hidden display, software OpenGL, fonts, XTest
        run: |
          bash scripts/ci-apt.sh xvfb fonts-dejavu-core libgl1 libegl1 libgl1-mesa-dri \
            libxkbcommon-x11-0 libxcursor1 libxi6 libxrandr2 libxinerama1 libxtst6 libx11-xcb1 \
            libfontconfig1 libdbus-1-3 libwayland-client0
      - name: kitty ${{ env.KITTY_VERSION }} (the official build, checksum-pinned; apt's kitty is too old)
        run: |
          url="https://github.com/kovidgoyal/kitty/releases/download/v$KITTY_VERSION/kitty-$KITTY_VERSION-x86_64.txz"
          curl -fsSL -o "$RUNNER_TEMP/kitty.txz" "$url"
          echo "$KITTY_SHA256  $RUNNER_TEMP/kitty.txz" | sha256sum -c -
          mkdir -p "$HOME/.local/kitty.app" "$HOME/.local/bin"
          tar -xJf "$RUNNER_TEMP/kitty.txz" -C "$HOME/.local/kitty.app"
          ln -sf "$HOME/.local/kitty.app/bin/kitty" "$HOME/.local/kitty.app/bin/kitten" "$HOME/.local/bin/"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: check.sh (everything, with the hidden test kitty)
        run: |
          kitty --version
          bash scripts/check.sh
      - name: Keep the screenshot and the test kitty's logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: gauntlet-kitty-${{ github.sha }}
          path: |
            /tmp/ninelives-check.png
            /tmp/ninelives-test/kitty.log
            /tmp/ninelives-test/stub.log
            /tmp/ninelives-test/state/sidebar.txt
            /tmp/ninelives-test/shots/
          if-no-files-found: ignore
          retention-days: 14

  macos:
    needs: quick
    runs-on: macos-15
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: kitty ${{ env.KITTY_VERSION }} for macOS (the official .dmg, checksum-pinned)
        run: |
          url="https://github.com/kovidgoyal/kitty/releases/download/v$KITTY_VERSION/kitty-$KITTY_VERSION.dmg"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/kitty.dmg" "$url"
          echo "$KITTY_DMG_SHA256  $RUNNER_TEMP/kitty.dmg" | shasum -a 256 -c -
          hdiutil attach -nobrowse -readonly -mountpoint "$RUNNER_TEMP/kitty-dmg" "$RUNNER_TEMP/kitty.dmg"
          mkdir -p "$HOME/Applications"
          cp -R "$RUNNER_TEMP/kitty-dmg/kitty.app" "$HOME/Applications/"
          hdiutil detach "$RUNNER_TEMP/kitty-dmg"
          ls "$HOME/Applications/kitty.app/Contents/MacOS"
          "$HOME/Applications/kitty.app/Contents/MacOS/kitty" --version
      - name: check-macos.sh (macOS's own /bin/bash 3.2, /usr/bin/python3, zsh and BSD tools)
        run: |
          /bin/bash --version | head -1
          /bin/bash scripts/check-macos.sh "$HOME/Applications/kitty.app"

  required:
    if: always()
    # to make the macOS lane required too: needs: [lint, quick, kitty, macos]
    needs: [lint, quick, kitty]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Every lane passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "lane results: $RESULTS"
          for r in $RESULTS; do [ "$r" = success ] || { echo "::error::a Gauntlet lane did not pass ($r)"; exit 1; }; done

  guard:
    # Never on pull requests: the scan attests and uploads SARIF, which needs write permissions
    # a fork's PR doesn't get. Registration on hol.org only works through this reusable workflow.
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
      security-events: write
    uses: hashgraph-online/hol-guard/.github/workflows/guarded-repository.yml@f590c7d61400ff6553cf0bcc03a72e9694f69048
    with:
      profile: strict-security
      fail_on_severity: critical
      upload_sarif: true
      visibility: public
