# ninelives-macos.conf — NineLives' macOS settings. kitty.conf reads this file only on macOS
# (globinclude ninelives-${KITTY_OS}.conf, at its end, so these win); on Linux it is installed but
# never read. macOS support is new and not yet tried on a real Mac: please report what works.

# Remote-control socket (the restart, tab search, Ctrl+Alt+U). kitty.conf's listen_on uses
# XDG_RUNTIME_DIR, which macOS doesn't set. A relative path goes in your temp folder instead
# ($TMPDIR, /var/folders/…/T/, which only you can open). Takes effect when kitty starts.
listen_on unix:ninelives-kitty-{kitty_pid}

# Ctrl+Alt+M (Ctrl+Option+M): mute / unmute the tab sounds, played with afplay. Older macOS can't
# play .oga files (macOS 15 can), so install.sh adds .wav copies of the sounds, which all can.
# afplay's volume is taken to be a plain gain and paplay's scale is cubed, so (v / 65536)^3 is
# meant to match Linux.
map ctrl+alt+m launch --type=background sh -c 'k="${KITTY_CONFIG_DIRECTORY:-${XDG_CONFIG_HOME:-$HOME/.config}/kitty}"; if [ -e "$k/sounds-off" ]; then rm -f "$k/sounds-off"; s="$k/sounds/done.wav"; [ -e "$s" ] && [ ! -e "$k/sounds-classic" ] || s=/System/Library/Sounds/Glass.aiff; v=$(cat "$k/sounds-volume" 2>/dev/null || echo 100); afplay -v "$(awk -v v="$v" "BEGIN { printf \"%.4f\", (400 * v / 65536) ^ 3 }")" "$s"; else touch "$k/sounds-off"; fi'
