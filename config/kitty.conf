# kitty set up to look and feel like COSMIC Terminal (made by Claude, 2026-11-14).
# Reload after editing: ctrl+shift+F5.  Bigger/smaller text: ctrl+shift+= / ctrl+shift+-

# Colors: COSMIC Dark. For light, change this to: include cosmic-light.conf
include cosmic-dark.conf

# Same font as COSMIC Terminal (DejaVu Sans Mono, size 16 there ~ 12pt here)
font_family      DejaVu Sans Mono
font_size        12.0

# Cursor and window
cursor_shape          beam
cursor_blink_interval 0.6 ease-in-out
window_padding_width  6
remember_window_size  yes
initial_window_width  110c
initial_window_height 32c
scrollback_lines      20000
enable_audio_bell     no
visual_bell_duration  0.35 ease-in-out

# Tabs in a sidebar on the left (kitty 0.50+): full names, room for many tabs
tab_bar_edge          left
tab_title_max_length  30
tab_bar_style         separator
tab_separator         ""
tab_bar_min_tabs      1
# "+" at the end of the sidebar: click it for a new tab (kitty 0.50+)
tab_bar_show_new_tab_button yes
# Each tab is drawn by draw_title() in tab_bar.py ({custom}), two lines (kitty has no tab tooltips):
#   " 12 ◐ name"     number, status icon, folder name (or Claude's/omp's title), cut with … to fit
#   "      folder  3m"   the last two folders, muted; at the right, how long the tab has been
#                        working / waiting / finished (from one minute on)
# Status icons: spinning ◐◓◑◒ = working (blue), ✓ = finished (green, until you look at the tab),
# ⚠ on an amber block = waiting for you, ✗ = error (red), • = new output. Colours follow the light/dark theme.
# ({bell_symbol:.0}{activity_symbol:.0} print nothing; they stop kitty adding its own red symbols.)
tab_title_max_lines   2
tab_title_template    "{bell_symbol:.0}{activity_symbol:.0}{custom}"
tab_activity_symbol   "• "
bell_on_tab           "🔔 "
active_tab_font_style bold

# Split panes: thin borders like COSMIC Terminal
window_border_width   1px
draw_minimal_borders  yes

# New tabs/windows start in the current folder (like COSMIC Terminal's setting)
map ctrl+shift+t     new_tab_with_cwd
map ctrl+shift+enter new_window_with_cwd
# Copy/paste the usual Linux way (ctrl+shift+c / ctrl+shift+v) is built in.
# Selecting text with the mouse copies it straight to the clipboard (paste with ctrl+v elsewhere).
copy_on_select clipboard
# Right-click pastes the clipboard.
mouse_map right press ungrabbed paste_from_clipboard

# ---- Tabs: mouse and keys ----
# Mouse: click a tab = switch, drag = reorder, MIDDLE-click = close, "+ New tab" = new tab.
# Keys like GNOME/COSMIC terminals:
map ctrl+shift+w         close_tab
map ctrl+page_up         previous_tab
map ctrl+page_down       next_tab
map ctrl+shift+page_up   move_tab_backward
map ctrl+shift+page_down move_tab_forward
map ctrl+shift+left      move_tab_backward
map ctrl+shift+right     move_tab_forward
map alt+1 goto_tab 1
map alt+2 goto_tab 2
map alt+3 goto_tab 3
map alt+4 goto_tab 4
map alt+5 goto_tab 5
map alt+6 goto_tab 6
map alt+7 goto_tab 7
map alt+8 goto_tab 8
map alt+9 goto_tab 9
# Rename the current tab
map ctrl+shift+r set_tab_title
# Find a tab (tab-finder.py): a search box over this tab, and a jump to the tab waiting for you.
# (No --cwd=current on overlays: from a window running the ssh kitten, kitty would start them on the
# remote host. The sidebar describes the window under an overlay anyway.)
map ctrl+shift+space launch --type=overlay --allow-remote-control --title current sh -c 'exec python3 "${KITTY_CONFIG_DIRECTORY:-${XDG_CONFIG_HOME:-$HOME/.config}/kitty}/tab-finder.py" search'
map ctrl+alt+u       launch --type=background --allow-remote-control sh -c 'exec python3 "${KITTY_CONFIG_DIRECTORY:-${XDG_CONFIG_HOME:-$HOME/.config}/kitty}/tab-finder.py" waiting'
# Ask before closing a tab/window that still has something running (e.g. Claude)
confirm_os_window_close 1

# ---- Restart without losing tabs (scripts/kitty-relaunch.sh) ----
# The restart script reads and reopens this kitty's tabs over a remote-control socket. Each kitty
# gets its own, in your private runtime folder (/run/user/<your uid>, which only you can open).
# socket-only: programs inside kitty can't use remote control through the terminal; tab-finder.py
# gets its own one-off connection (launch --allow-remote-control). A kitty started with --listen-on
# (a launcher, the test kitty) keeps that socket instead: the command line wins.
# Takes effect when kitty starts, not on Ctrl+Shift+F5.
allow_remote_control socket-only
listen_on            unix:${XDG_RUNTIME_DIR}/ninelives-kitty-{kitty_pid}

# ---- Readability ----
# Faded ("dim") text was drawn at 40% strength, too faint. 75% keeps it readable.
dim_opacity 0.75
# If a program picks a text color nearly invisible on the background (e.g. white text made for
# dark themes, on the light theme), kitty swaps it for black/white so it stays readable.
# Measured as a contrast ratio: only text below 2:1 is changed. (35% was too strong: it turned
# normal red, blue, purple, grey and orange text white.)
text_fg_override_threshold 2 ratio
# Slightly heavier text, which helps dark text on the light background.
text_composition_strategy 1.7 30

# ---- Help: F1 (or Ctrl+Shift+/) shows a shortcut cheat sheet over the current tab ----
# (from this kitty's config folder: KITTY_CONFIG_DIRECTORY, or $XDG_CONFIG_HOME/kitty, or ~/.config/kitty)
map f1               launch --type=overlay --title current sh -c 'exec "${KITTY_CONFIG_DIRECTORY:-${XDG_CONFIG_HOME:-$HOME/.config}/kitty}/shortcuts.sh"'
map ctrl+shift+slash launch --type=overlay --title current sh -c 'exec "${KITTY_CONFIG_DIRECTORY:-${XDG_CONFIG_HOME:-$HOME/.config}/kitty}/shortcuts.sh"'

# ---- Settings: Ctrl+Shift+F2 (or ⚙ at the top of the sidebar) ----
# NineLives' settings as a list over the current tab (settings.py): ↑/↓ choose, Enter or ←/→ change,
# Esc closes; changes apply at once. Its last row opens kitty.conf in your editor, which is what
# Ctrl+Shift+F2 does in plain kitty. (Remote control: for that row, and so a second press closes it.)
map ctrl+shift+f2    launch --type=overlay --allow-remote-control --title current sh -c 'exec python3 "${KITTY_CONFIG_DIRECTORY:-${XDG_CONFIG_HOME:-$HOME/.config}/kitty}/settings.py"'

# ==== Extras (kitty 0.50) ====
# Animated cursor trail when the cursor jumps (e.g. clicking around, big moves)
cursor_trail                 3
cursor_trail_decay           0.1 0.4
cursor_trail_start_threshold 2

# Desktop notification when something that ran 15 s+ finishes in a tab you're not looking at
notify_on_cmd_finish unfocused 15.0 notify

# Transparency you can change live: Ctrl+Shift+A then M (more) / L (less) / 1 (solid) / D (default)
dynamic_background_opacity yes
background_blur 24

# Split panes like COSMIC Terminal: mouse focuses a pane; unfocused panes are slightly faded
focus_follows_mouse yes
inactive_text_alpha 0.8
enabled_layouts     splits,stack,tall,grid
map ctrl+alt+right  launch --location=vsplit --cwd=current
map ctrl+alt+down   launch --location=hsplit --cwd=current
map ctrl+alt+z      toggle_layout stack
map ctrl+alt+left   neighboring_window left
map ctrl+alt+up     neighboring_window up
map ctrl+alt+h      neighboring_window left
map ctrl+alt+l      neighboring_window right
map ctrl+alt+k      neighboring_window up
map ctrl+alt+j      neighboring_window down

# Nicer text details
modify_font          cell_height 106%
undercurl_style      thick-sparse
strip_trailing_spaces smart
scrollback_pager_history_size 64

# ==== Fun: animations + sounds ====
# Cursor blink fades smoothly (set above: cursor_blink_interval 0.6 ease-in-out)
# A bell flashes the window in the accent color instead of beeping
visual_bell_color     #e67e00
# Tab status sounds + sparkle/pulse animations live in tab_bar.py.
# Ctrl+Alt+M: mute / unmute those sounds (plays the "finished" chime when turning sound back on)
map ctrl+alt+m launch --type=background sh -c 'k="${KITTY_CONFIG_DIRECTORY:-${XDG_CONFIG_HOME:-$HOME/.config}/kitty}"; if [ -e "$k/sounds-off" ]; then rm -f "$k/sounds-off"; s="$k/sounds/done.oga"; [ -e "$s" ] && [ ! -e "$k/sounds-classic" ] || s=/usr/share/sounds/freedesktop/stereo/complete.oga; v=$(cat "$k/sounds-volume" 2>/dev/null || echo 100); paplay --volume=$((40000 * v / 100)) "$s"; else touch "$k/sounds-off"; fi'

# ==== macOS ====
# On a Mac (and only there: KITTY_OS is kitty's name for the system it runs on) kitty also reads
# ninelives-macos.conf, which changes what doesn't work there: the socket above (macOS has no
# XDG_RUNTIME_DIR) and the sound player in Ctrl+Alt+M. On Linux this line finds no file and does nothing.
globinclude ninelives-${KITTY_OS}.conf
